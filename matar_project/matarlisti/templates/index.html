{% load tailwind_cli %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test tailwind</title>
    {% tailwind_css %}
</head>
<body class="p-4 bg-orange-50 text-stone-900">
    <header class="bg-red-800 p-4 text-white flex justify-between items-center sticky rounded-lg">
        <h1 class="font-bold text-center">Matarsíða</h1>
        <p class="text-right">Menu</p>
    </header>
    <main class="p-4">
        <p class="text-3xl font-bold text-center">Places</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6 p-4">
            {% for stadur in stadir %}
                {% include "partials/place_component.html" with stadur=stadur %}
            {% endfor %}
        </div>
    </main>
    <footer class="bg-red-800 text-white p-4 grid grid-cols-3 gap-4 text-center rounded-lg">
        <p>Map</p>
        <a href="/myworld/Test/History.html">History</a>
        <a href="/myworld/Test/Profile.html">Profile</a>
    </footer>
</body>
</html>
