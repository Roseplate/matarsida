{% for restaurant in matarlisti %}

<div>
    <h2>{{ restaurant.name }}</h2>

    {% if restaurant.img %}
        <img src="{{ restaurant.img }}" alt="{{ restaurant.name }}" />
    {% endif %}

    <p>
        {{ restaurant.description }}
    </p>

    <a href="{% url 'upload_image' restaurant.id %}">Change image</a>
</div>

{% endfor %}
