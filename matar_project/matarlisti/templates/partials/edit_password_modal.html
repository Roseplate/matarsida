<!-- Backdrop & Centering -->
<div class="modal fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
  
    <div 
        class="fixed inset-0 z-0 bg-black/50 backdrop-blur-sm"
        hx-get="{% url "remove" %}" 
        hx-target="closest .modal"
        hx-swap="delete">
    </div>

    <!-- Card - Vinna Innan Þessu -->
    <div class="z-10 rounded-xl bg-white p-6">

        <!-- Setja Dót Hér -->
        <div class="px-6 py-4 text-sm text-gray-600">
            <div class="z-10 w-full max-w-md rounded-xl bg-white p-6">
                <h2 class="mb-4 text-2xl font-bold">Change password</h2>

                <form hx-post="{% url 'change_password' %}" hx-target="#password-result"
                    hx-on::after-request="if (this.querySelector('#password-result div')) this.reset()"
                    class="flex flex-col gap-3">
                    {% csrf_token %}
                    <input type="password" name="old_password" placeholder="Current password" required
                        autocomplete="current-password" class="rounded border p-2">
                    <input type="password" name="new_password" placeholder="New password" required
                        autocomplete="new-password" class="rounded border p-2">
                    <input type="password" name="new_password2" placeholder="Repeat new password" required
                        autocomplete="new-password" class="rounded border p-2">

                        <div id="password-result" class="text-sm"></div>
                        <div class="flex gap-2">
                        <button class="rounded-lg bg-red-800 px-4 py-2 font-bold text-white">Change</button>
                        <!--<button type="button" class="rounded-lg bg-stone-200 px-4 py-2 font-bold"
                                hx-get="{% url "remove" %}" hx-target="closest .modal" hx-swap="delete">Close</button> -->
                    </div>
                </form>
            </div>
        </div>

        <div class="bg-red-800 p-2 text-white items-center rounded-lg" hx-target="closest .modal" hx-get="{% url "remove" %}" hx-swap="delete">
            <button >Close</button>
        </div>

    </div>
</div>
