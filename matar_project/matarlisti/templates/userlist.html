<h1>User List</h1>


<table>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>User Creation</th>
    </tr>
    {% for user in users %}
    <tr>
        <td> {{ user.id }}</td>
        <td> {{ user.firstname }}</td>
        <td> {{ user.lastname }}</td>
        <td> {{ user.created_at }}</td>
    </tr>
    {% endfor %}
</table>
